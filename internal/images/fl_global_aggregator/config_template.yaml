server:
  address: "0.0.0.0:%d"
  global-rounds: %d

strategy:
  fraction-fit: 1.0
  fraction-evaluate: 1.0
  min-fit-clients: %d
  min-evaluate-clients: %d
  min-available-clients: %d
  aom-rounds-treshold: %d
  aom-selection-enabled: %v
  inflight-threshold: %f
  # Run server-side eval every N rounds (1 = every round)
  server-eval-every-rounds: 1
  # Use only first N batches for intermediate-round server eval (0/none = full)
  server-eval-max-batches: 50

urls:
  metric-server-url: "%s"

paths:
  dataset-dir: "%s"
  model-file: "%s"
