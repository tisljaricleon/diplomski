server:
  address: "0.0.0.0:8080"
  global-rounds: 2

strategy:
  fraction-fit: 1.0
  fraction-evaluate: 1.0
  min-fit-clients: 2
  min-evaluate-clients: 2
  min-available-clients: 2
  aom-rounds-treshold: 3
  aom-selection-enabled: true
  inflight-threshold: 99999992.0
  # Run server-side eval every N rounds (1 = every round)
  server-eval-every-rounds: 1
  # Use only first N batches for intermediate-round server eval (0/none = full)
  server-eval-max-batches: 10

urls:
  metric-server-url: "http://localhost:8001"

paths:
  dataset-dir: "/data"
  model-file: "/model/model.pt"
  state-file: "/model/state.json"
